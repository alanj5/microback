name: CI
on: [push, pull_request]
jobs:
  cpp:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then export CXX=g++; else export CXX=clang++; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMICROBACK_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install clang-format==23.1.2
      - run: python scripts/check_format.py
