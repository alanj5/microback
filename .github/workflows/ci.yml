name: CI
on: [push, pull_request]
jobs:
  cpp:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then export CXX=g++; else export CXX=clang++; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMICROBACK_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install clang-format==23.1.2
      - run: python scripts/check_format.py
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - run: python -m pytest tests/python
      - run: python examples/research.py
      - run: python scripts/generate.py data/generated/small.csv
      - run: python scripts/research.py --synthetic-only --output output/smoke-research
  benchmark-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DMICROBACK_BENCHMARKS=ON
      - run: cmake --build build --parallel 2
      - run: build/microback_bench --benchmark_filter='^(add|cancel|modify|best|trade|walk)$' --benchmark_min_time=0.01s
